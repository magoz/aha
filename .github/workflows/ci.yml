name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's sandbox needs.
      # Allow them on the runner instead of disabling the sandbox in the preview tool.
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm verify
      - name: Build Vercel functions offline (no credentials or deployment)
        run: |
          mkdir -p .vercel "$RUNNER_TEMP/vercel-offline"
          cp fixtures/vercel-project.json .vercel/project.json
          touch .vercel/.env.preview.local
          pnpm dlx vercel@59.11.7 build --global-config "$RUNNER_TEMP/vercel-offline"

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec alchemy --help
